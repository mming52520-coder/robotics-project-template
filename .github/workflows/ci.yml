name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-template:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate structure and safety defaults
        run: python tools/validate_template.py

      - name: Validate design contracts and Skills
        run: bash scripts/run-checks.sh

      - name: Check Python
        run: python -m ruff check tools src/robotics_sim tests/unit/test_sim_core.py

      - name: Check YAML
        run: yamllint --config-file .yamllint.yaml .

      - name: Check Markdown
        run: pymarkdown --config .pymarkdown.json scan .

      - name: Check shell
        run: shellcheck scripts/*.sh

  ros2-simulation:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and test ROS 2 simulation
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select robotics_sim
          source install/setup.bash
          python3 -m pytest -q src/robotics_sim/test/test_*.py \
            --junitxml=build/robotics_sim/test_results/robotics_sim/pytest.xml
          colcon test-result --verbose

      - name: Preserve ROS 2 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros2-simulation-logs
          path: log/
          if-no-files-found: warn
