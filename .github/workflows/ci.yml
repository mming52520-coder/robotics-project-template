name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-template:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVIDENCE_RUN_ID: offline-${{ github.run_id }}-${{ github.run_attempt }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run deterministic repository checks
        run: bash scripts/run-checks.sh

      - name: Verify repository evidence
        run: python3 tools/evidence.py validate "artifacts/${EVIDENCE_RUN_ID}"

      - name: Preserve repository evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-check-evidence
          path: artifacts/
          if-no-files-found: warn

  ros2-simulation:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    timeout-minutes: 15
    env:
      EVIDENCE_RUN_ID: ros-${{ github.run_id }}-${{ github.run_attempt }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ROS_CONTAINER_IMAGE: ros:jazzy-ros-base
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust checked-out workspace in ROS container
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install contract validator
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-jsonschema

      - name: Build and test ROS 2 simulation
        shell: bash
        run: bash scripts/run-ros-checks.sh

      - name: Verify ROS 2 evidence
        shell: bash
        run: python3 tools/evidence.py validate "artifacts/${EVIDENCE_RUN_ID}"

      - name: Preserve ROS 2 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros2-simulation-logs
          path: |
            artifacts/
            log/
            build/robotics_sim/test_results/robotics_sim/pytest.xml
          if-no-files-found: warn
